name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check and build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'preview-release' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust and Just
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "$TARGET"
          cargo install --locked just
      - name: Install sandbox prerequisites
        run: just sandbox-prerequisites
      - name: Check
        run: just check
      - name: Check sandboxed Markdown
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: just test-markdown-sandbox
      - name: Build and package
        run: just package "$TARGET" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markmason-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
