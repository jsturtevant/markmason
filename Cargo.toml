[package]
name = "markmason"
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
description = "Standalone Markdown-driven CLI end-to-end test runner"
license = "MIT"
repository = "https://github.com/jsturtevant/markmason"

[[bin]]
name = "mm"
path = "src/main.rs"

[[example]]
name = "mm-test-cli"
path = "tests/support/test_cli.rs"

[dependencies]
anstream = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
dunce = "1"
mxc-sdk = { version = "1.0.1", default-features = false, optional = true }
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
serde_yaml = "0.9"
tempfile = "3"
tree-sitter = "0.26.13"
tree-sitter-bash = "0.25.1"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = ["sandbox-mxc"]
sandbox-mxc = ["dep:mxc-sdk"]
