[package]
name = "markmason"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Standalone Markdown-driven CLI end-to-end test runner"
license = "MIT"
repository = "https://github.com/jsturtevant/markmason"

[[bin]]
name = "mm"
path = "src/main.rs"

[[example]]
name = "mm-test-cli"
path = "tests/support/test_cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dunce = "1"
portable-pty = "0.9"
regex = "1"
serde_yaml = "0.9"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
